function iso(){return new Date().toISOString()}function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}

function commit(entity,record,key){const id=String(key||record.id||record.service);const prev=db[entity].find(x=>String(x.id||x.service)===id);const now=iso();const updated_at=prev&&prev.updated_at&&prev.updated_at>=now?new Date(Date.parse(prev.updated_at)+1).toISOString():now;const next={...record,updated_at,updated_by:config.actor};const idx=db[entity].findIndex(x=>String(x.id||x.service)===id);if(idx>=0)db[entity][idx]=next;else db[entity].push(next);queue=queue.filter(x=>!(x.entity===entity&&x.id===id));queue.push({entity,id,record:next,updated_at,op_id:uid()});persist();render();if(config.endpoint||typeof google!=='undefined'&&google.script&&google.script.run)void syncData(false);return next}
function updateTaskStatus(id,status){let t=db.tasks.find(x=>x.id===id);if(!t)return;if(status==='완료'){const deps=String(t.depends_on||'').split(',').map(x=>x.trim()).filter(Boolean);let miss=deps.filter(x=>db.tasks.find(y=>y.id===x)?.status!=='완료');if(miss.length){toast('선행 작업 미완료: '+miss.join(', '));return}try{const check=JSON.parse(t.checklist||'[]');if(check.some(x=>!x.done)){toast('체크리스트를 먼저 완료하세요.');return}}catch(e){}}commit('tasks',{...t,status},id)}

function normalizeOld(data){const old=data.data||data;const names=old.members||[],projects=(old.projects||[]).map(p=>({...p,id:String(p.id),name:p.name||p.title||p.id,color:p.color||'#e79d78',description:p.description||''}));const members=names.map(m=>({id:String(m.id||uid()),name:m.name||m.id,kind:m.kind||(m.agent?'agent':'human'),role:m.role||'',color:m.color||'#a49dff',capacity:m.capacity||40}));const tasks=(old.tasks||[]).map(t=>({...t,id:String(t.id||uid()),project:t.project||t.projectId||projects[0]?.id||'',title:t.title||'제목 없음',owner:t.owner||members.find(m=>m.id===t.assigneeId)?.name||'박새암',status:STATUS.includes(t.status)?t.status:({backlog:'백로그',todo:'할 일',progress:'진행 중',doing:'진행 중',inprogress:'진행 중',review:'REVIEW',done:'완료'}[t.status]||'백로그'),priority:typeof t.priority==='string'?({low:'낮음',medium:'보통',high:'높음',urgent:'긴급'}[t.priority]||t.priority):'보통',start:t.start||t.startDate||'',due:t.due||t.dueDate||'',est_hours:t.est_hours??t.estimate??0,actual_hours:t.actual_hours??t.actual??0,depends_on:t.depends_on||((t.dependencies||[]).join(',')),checklist:typeof t.checklist==='string'?t.checklist:JSON.stringify(t.checklist||[]),memo:t.memo||t.description||'',updated_at:t.updated_at||iso(),updated_by:t.updated_by||config.actor,sprint_id:t.sprint_id||t.sprintId||'',type:t.type||'작업',story_points:t.story_points??t.points??0}));const sprints=(old.sprints||[]).map(s=>({...s,id:String(s.id||uid()),project:s.project||s.projectId||projects[0]?.id||'',name:s.name||'스프린트',goal:s.goal||'',start:s.start||s.startDate||'',due:s.due||s.endDate||s.dueDate||'',status:s.status||'계획'}));return {projects,members,tasks,sprints,ai_usage:old.ai_usage||[],log:[]}}
async function importJson(file){try{const x=JSON.parse(await file.text()),incoming=normalizeOld(x);if(!incoming.projects.length&&!incoming.tasks.length)throw Error('가져올 프로젝트나 작업이 없습니다.');if(!confirm('기존 데이터와 병합하고 시트에 동기화 대기열을 생성할까요? 먼저 JSON 백업을 권장합니다.'))return;let count=0;for(let e of ['projects','members','sprints','tasks','ai_usage'])for(let r of incoming[e]){let id=r.id||r.service;if(!id)continue;commitSilent(e,r,id);count++}persist();render();toast(count+'개 레코드를 가져왔습니다. 동기화해 주세요.');}catch(e){toast('가져오기 실패: '+e.message)}}

 <section class="pf33-focus"><div class="pf33-section-top"><div><div class="pf33-eyebrow">NEXT ACTIONS / PRIORITY QUEUE</div><h2>다음 할 일 <b>${String(follow.nextThree.length).padStart(2,'0')}</b></h2></div><button class="btn small" id="exportWeeklyPng">주간 PNG</button></div><div class="pf33-quickfilter"><label>담당 유형 <small>/ OWNER</small></label><select id="ownerType" aria-label="담당자 유형"><option value="all" ${ui.ownerType==='all'?'selected':''}>전체</option><option value="human" ${ui.ownerType==='human'?'selected':''}>사람</option><option value="agent" ${ui.ownerType==='agent'?'selected':''}>AI 에이전트</option><option value="external" ${ui.ownerType==='external'?'selected':''}>외부 AI</option></select></div>${follow.nextThree.length?follow.nextThree.map(pf33TaskLine).join(''):'<div class="pf33-clear">할당 작업 없음 <small>/ QUEUE EMPTY</small></div>'}</section>
 <div class="pf33-telemetry"><div><small>진행률 · PROGRESS</small><strong>${metric.progress_percent}<em>%</em></strong><div class="pf33-meter"><span style="width:${metric.progress_percent}%"></span></div></div><div><small>지연 · OVERDUE</small><strong class="tone-red">${metric.overdue_count}</strong></div><div><small>임박 · T-3D</small><strong class="tone-orange">${metric.due_soon_count}</strong></div><div><small>작업 · TOTAL</small><strong>${metric.total_tasks}</strong></div></div>
 <div class="pf33-lower"><section class="card"><div class="pf33-section-top"><div><div class="pf33-eyebrow">PROJECT EXECUTION</div><h2>프로젝트 현황</h2></div><button class="btn small" data-view="board">작업 보기</button></div>${db.projects.map(p=>{const tasks=db.tasks.filter(t=>t.project===p.id),n=progress(tasks);const next=pf33Summary(tasks).nextThree[0];const url=pf33SafeLink(p.latest_output_url);const thumb=pf33SafeLink(p.thumbnail_url);return `<div class="pf33-project"><div class="pf33-projecthead"><strong>${esc(p.name)}</strong><span>${n}%</span></div><div class="pf33-stage">${pf33Stage(tasks)}</div><div class="pf33-projectnext">다음 · ${next?esc(next.title):'대기 작업 없음'}</div><div class="pf33-projectbottom"><span>완료 ${tasks.filter(t=>t.status==='완료').length}/${tasks.length}</span>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">최신 산출물 열기</a>`:'<span>산출물 링크 없음</span>'}</div>${url&&thumb?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer"><img class="pf33-thumb" src="${esc(thumb)}" alt="프로젝트 산출물 미리보기" loading="lazy" referrerpolicy="no-referrer"></a>`:''}</div>`;}).join('')}</section>
 <section class="card"><div class="pf33-section-top"><div><div class="pf33-eyebrow">WEEKLY TIMELINE</div><h2>이번 주 일정</h2></div><span class="pf33-code">T+6D</span></div>${weeks.length?weeks.map(e=>`<div class="pf33-week"><time>${esc(e.date.slice(5))}</time><span>${esc(e.title)}</span><small>${esc(e.type)}</small></div>`).join(''):'<div class="pf33-clear">예정된 마감 없음</div>'}<div class="pf33-help">수동 마감: 작업의 유형을 ‘수동 마감’으로 선택. 캘린더는 선택적 읽기 전용 연동입니다.</div><div class="pf33-templates"><button class="btn small" id="templateExpense">경비정산 템플릿</button><button class="btn small" id="templateDiagnose">진단 흐름 템플릿</button></div></section>
 <section class="card"><div class="pf33-section-top"><div><div class="pf33-eyebrow">DEADLINE / EXCLUSIVE</div><h2>추가 위험 작업 <b class="tone-orange">${s.risk.length}</b></h2></div></div>${s.risk.slice(0,5).map(pf33TaskLine).join('')||'<div class="pf33-clear">추가 위험 작업 없음</div>'}</section><section class="card">${usageCard(true)}</section></div>`;
 byId('view-today').innerHTML=html;
}
renderSettings=function(){pf33Settings();const host=byId('view-settings');host.insertAdjacentHTML('beforeend',`<section class="card"><div class="pf33-section-top"><h2>업무 템플릿 · TEMPLATES</h2></div><div class="pf33-templates"><button class="btn" id="templateExpense">경비정산 월별</button><button class="btn" id="templateDiagnose">진단 건 흐름</button></div><p class="subhint">고객·농장주·금액·진단 원자료를 입력하지 마세요. 상태·건수·링크만 관리합니다.</p></section>`);};
function pf33Template(kind){const expense=kind==='expense';const id=expense?'expense-'+today().slice(0,7):'diagnostic-'+uid().slice(0,8);if(db.projects.some(p=>p.id===id)){toast('이번 달 경비정산 프로젝트가 이미 있습니다.');return;}const title=expense?'경비정산 월별 · '+today().slice(0,7):'진단 건 흐름';const steps=expense?['영수증 수집','카드 대사','서류 완성','기안 승인']:['접수','결과 수신','농장 전달','후속조치','영업 연계'];commit('projects',{id,name:title,color:'#9be7f8',description:'민감 정보 입력 금지',latest_output_url:'',thumbnail_url:''},id);steps.forEach((name,i)=>commitSilent('tasks',{id:uid(),project:id,title:name,owner:i===steps.length-1?'박새암':'공대리',status:i===0?'할 일':'백로그',priority:'보통',start:today(),due:dayOffset(expense?Math.min(28,3+(i*6)):(i===1?14:(2+i*5))),type:expense?'expense':'diagnostic',version:'',needs_owner_action:name==='기안 승인'?'TRUE':'FALSE',owner_action_reason:name==='기안 승인'?'전자결재 승인':'',blocked_reason:'',widget_safe:'TRUE',est_hours:1,actual_hours:0,depends_on:'',checklist:'[]',memo:''},'local'));persist();render();if(config.endpoint||hasDirect())void syncData(false);toast('템플릿 프로젝트를 만들었습니다.');}
function pf33WeeklyPng(){const s=pf33Summary(),cv=document.createElement('canvas');cv.width=1400;cv.height=820;const ctx=cv.getContext('2d');ctx.fillStyle='#090b0e';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#2a3238';ctx.strokeRect(48,48,1304,720);ctx.fillStyle='#9be7f8';ctx.font='bold 22px monospace';ctx.fillText('PEACHFLOW / WEEKLY MISSION REPORT',85,104);ctx.fillStyle='#dfe8eb';ctx.font='18px sans-serif';ctx.fillText('기준일 '+today()+' / 내부 공유용 / 고객 개인정보 제외',85,144);const fields=[['결정 대기',s.decisions_count],['다음 할 일',s.nextThree.length],['지연',s.overdue_count],['진행률',s.progress_percent+'%']];fields.forEach(([k,v],i)=>{let x=85+i*315;ctx.fillStyle='#7e9199';ctx.font='16px sans-serif';ctx.fillText(k,x,230);ctx.fillStyle='#edf3f4';ctx.font='bold 42px monospace';ctx.fillText(String(v),x,295)});ctx.strokeStyle='#253037';ctx.beginPath();ctx.moveTo(85,325);ctx.lineTo(1310,325);ctx.stroke();ctx.fillStyle='#9be7f8';ctx.font='bold 20px sans-serif';ctx.fillText('NEXT ACTIONS',85,385);ctx.font='20px sans-serif';s.nextThree.forEach((t,i)=>{ctx.fillStyle='#e7edef';ctx.fillText(String(i+1).padStart(2,'0')+' / '+String(t.title).slice(0,50),85,437+i*62);ctx.fillStyle='#8c989d';ctx.font='15px sans-serif';ctx.fillText(t.owner||'',95,458+i*62);ctx.font='20px sans-serif'});ctx.font='15px monospace';ctx.fillStyle='#8c989d';ctx.fillText('SOURCE: LOCAL CACHE / VERIFY SYNC STATUS BEFORE DISTRIBUTION',85,729);cv.toBlob(blob=>{if(!blob)return toast('PNG 생성 실패');const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='PeachFlow_Weekly_'+today()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png');}
document.addEventListener('change',e=>{if(e.target.id==='ownerType'){ui.ownerType=e.target.value;render();}});
document.addEventListener('click',e=>{if(e.target.closest('#exportWeeklyPng'))pf33WeeklyPng();if(e.target.closest('#templateExpense'))pf33Template('expense');if(e.target.closest('#templateDiagnose'))pf33Template('diagnostic');});

render();if(config.endpoint||hasDirect())void syncData(false);setInterval(()=>{if(!document.hidden&&(config.endpoint||hasDirect())&&navigator.onLine)void syncData(false)},90000);
</script></body></html>
